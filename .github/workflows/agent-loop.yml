name: Kalorienbrudi Agent-Loop

on:
  schedule:
    - cron: "0 5 * * *"      # täglich 05:00 UTC (07:00 dt. Sommerzeit)
  workflow_dispatch:          # manuell auslösbar

permissions:
  contents: write             # Zustand zurück ins Repo committen

concurrency:
  group: agent-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Loop ausführen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_TOKEN }}
        run: python loop/run_loop.py

      - name: Zustand committen
        run: |
          git config user.name  "kalorienbrudi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add loop/reports loop/proposals loop/state.json loop/decisions.md loop/backlog.md loop/TODO-*.md build_dashboard.py 2>/dev/null || true
          git commit -m "Agent-Loop $(date +%F)" || echo "nichts zu committen"
          git push
