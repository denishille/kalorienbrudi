# Spiegelt die Notion-Daten nach Supabase.
#
# Laeuft hier und nicht lokal, weil die Claude-Sandbox supabase.co nicht
# erreicht (Egress-Proxy) - ein Runner schon.
#
# Bewusst nur manuell: solange Notion die Eingabe traegt, entscheidet ihr,
# wann gespiegelt wird. Sobald der Umzug steht, kann hier ein schedule
# dazukommen (oder der Lauf entfaellt ganz).
name: Notion nach Supabase spiegeln

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Notion nach Supabase spiegeln
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_supabase.py
