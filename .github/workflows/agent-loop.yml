name: Kalorienbrudi Agent-Loop

on:
  schedule:
    - cron: "0 5 * * *" # täglich 05:00 UTC (07:00 dt. Sommerzeit)
  workflow_dispatch: # manuell auslösbar

permissions:
  contents: write # Zustand zurück ins Repo committen

concurrency:
  group: agent-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code installieren
        run: npm install -g @anthropic-ai/claude-code

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Loop ausführen
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python loop/run_loop.py

      - name: Zustand committen
        run: |
          git config user.name "kalorienbrudi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A ':!loop/__pycache__'
          if git diff --cached --quiet; then
            echo "nichts zu committen"
          else
            git commit -m "Agent-Loop $(date +%F)"
            git push
          fi
